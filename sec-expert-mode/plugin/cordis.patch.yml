# 网安专家模式 bundle 的 loader patch。
#
# 本包同时有 Host 半边（index.js）与 Client 半边（client.js）。
# Client 工厂经 package.json 的 `dsh.client` 由 dsh-client-modules 自动发现，
# 因此 patch 只需一行 —— 见下。
#
# 为什么这行必须落在 host 平面（而不是 preset 里）：
# `tools` 与 `systemPrompt` 都是进程级注册表，一旦注册进 preset 的
# entry-local realm，realm 之外的行看不见它，第二个 session 还会撞名。
# 这与 agentTeams 是同一条判据。
#
# agent 平面（多 Agent 扇出、攻击特化、情报检索纪律）由 preset 的
# `security-expert` 组合负责，不在此重复声明——一行一个所有者。
#
# ── 生效条件（实测结论，不是推测） ──────────────────────────────────────
# 本行只在 **Host 启动时**随 profile 层一起组合。运行中通过 plugin_manager
# 热装本 bundle 时，PluginManager 复用构造时缓存的 profileContext，而
# `readProfilePatches` 优先使用 profile 快照里的 `patches` 字段（该字段在
# `loadProfileDirectory` 里一次性从磁盘读入），因此新 bundle 的 patch 行
# **不会**被 reconcile。所以：安装本 bundle 后需要**重启 dsh**。
#
# 验证命令（重启后应看到 4 个 sec_ 工具）：
#   用 cordis_inspect_list + Tool.listTools，或在会话里直接看工具目录。
#
# ── 四个工具各自的职责 ─────────────────────────────────────────────────
#   sec_recon_plan    阶段一：生成侦察 Agent 作业面（不分配攻击 Agent）
#   sec_recon_fanout  阶段二：按侦察结果生成攻击 Agent 编制
#   sec_http_probe    取证：原始请求/响应采集 + pair 对照组
#   sec_payload_forge 变形：parser-diff 所需的编码/同形/承载变体

- insert:
    - id: sec-expert-mode
      name: 'dsh-sec-expert-mode'
      config:
        promptSection: true
        reconTool: true
        # 实战探测：原始 HTTP 请求/响应采集 + pair 对照组。
        # 关掉它，本模式会退化成「只会编排、不会取证」——不推荐。
        probeTool: true
        maxParallelAgents: 8
        evidenceRequired: true
        destructiveGuard: true
